# ============================================================================
# RaspberryPi5 视觉系统  —  配置文件
# ============================================================================
# 应用程序使用的**所有**参数必须在此文件中。
# 缺少任何键都会导致程序立即退出 —— 代码中**没有**默认值。
# ============================================================================

# ---------------------------------------------------------------------------
# 摄像头
# ---------------------------------------------------------------------------
camera:
  index: 0                         # 设备索引（video_path 为空时使用）
  video_path: ""                   # 非空 → 使用视频文件代替摄像头
  width: 640
  height: 480
  fps: 60

# ---------------------------------------------------------------------------
# 用户界面（OpenCV highgui）
# ---------------------------------------------------------------------------
ui:
  imshow_enable: true              # 显示 OpenCV 窗口
  ui_draw_enable: true             # 绘制叠加层（FPS / 模式 / 目标 …）
  window_name: "RPi5 视觉系统"

# ---------------------------------------------------------------------------
# 串口
# ---------------------------------------------------------------------------
serial:
  port: "/dev/ttyAMA10"
  baudrate: 115200

# ---------------------------------------------------------------------------
# Kalman 滤波器（所有模式共用）
# ---------------------------------------------------------------------------
# 重要：YAML 中这些是**标量**。
# 代码中转换：eye(N,N) * scalar → cv::Mat
# 状态模型严格为 2-D [x, y] —— **无速度分量**。
# transitionMatrix  = I₂
# measurementMatrix = I₂
# ---------------------------------------------------------------------------
kalman:
  process_noise_cov: 0.001         # 过程噪声协方差
  measurement_noise_cov: 0.01      # 测量噪声协方差
  init_frames: 3                   # 初始化前需连续稳定检测帧数
  lost_frame_limit: 30             # 连续丢失帧数 → 超时复位
  stable_distance_threshold: 30.0  # "稳定"检测的最大像素距离

# ---------------------------------------------------------------------------
# 视频录制（原始帧，**无** UI 叠加层）
# ---------------------------------------------------------------------------
recording:
  record_mode: false
  output_dir: "./recordings"
  fourcc: "MJPG"
  fps: 30.0

# ---------------------------------------------------------------------------
# 感兴趣区域（视觉算法前应用）
# ---------------------------------------------------------------------------
roi:
  x: 0
  y: 0
  width: 640
  height: 480

# ---------------------------------------------------------------------------
# 模式0  —  6 颜色物块检测（红 黄 蓝 绿 黑 青）
# ---------------------------------------------------------------------------
mode0:
  min_contour_area: 100
  morph_kernel_size: 3
  colors:
    red:
      range1: { h_min: 0,   s_min: 100, v_min: 50, h_max: 10,  s_max: 255, v_max: 255 }
      range2: { h_min: 170, s_min: 100, v_min: 50, h_max: 180, s_max: 255, v_max: 255 }
    yellow:
      range1: { h_min: 20,  s_min: 100, v_min: 100, h_max: 35, s_max: 255, v_max: 255 }
    blue:
      range1: { h_min: 100, s_min: 100, v_min: 50,  h_max: 130, s_max: 255, v_max: 255 }
    green:
      range1: { h_min: 40,  s_min: 80,  v_min: 50,  h_max: 80,  s_max: 255, v_max: 255 }
    black:
      range1: { h_min: 0,   s_min: 0,   v_min: 0,   h_max: 180, s_max: 255, v_max: 40 }
    cyan:
      range1: { h_min: 80,  s_min: 100, v_min: 50,  h_max: 100, s_max: 255, v_max: 255 }

# ---------------------------------------------------------------------------
# 模式1  —  圆环检测（Hough）
# ---------------------------------------------------------------------------
mode1:
  clahe_clip_limit: 2.0
  clahe_tile_size: 8
  morph_kernel_size: 3
  gaussian_kernel_size: 5
  hough_dp: 1.0
  hough_min_dist: 50.0
  hough_param1: 100.0
  hough_param2: 30.0
  hough_min_radius: 10
  hough_max_radius: 100

# ---------------------------------------------------------------------------
# 模式2  —  黑色圆柱检测
# ---------------------------------------------------------------------------
mode2:
  h_min: 0
  s_min: 0
  v_min: 0
  h_max: 180
  s_max: 255
  v_max: 45
  aspect_ratio_threshold: 2.0
  min_area: 200
  morph_kernel_size: 5

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
logging:
  level: "INFO"                    # DEBUG | INFO | WARN | ERROR
  log_to_file: false
  log_file_path: "./vision.log"
