# ═══════════════════════════════════════════════════════════════════
#  视觉识别系统 — 统一配置文件
#  修改此文件无需重新编译
# ═══════════════════════════════════════════════════════════════════

# ── 输入源选择 ──────────────────────────────────────────────────
input:
  type: "video"          # "camera" (实时摄像头) | "video" (离线视频文件)

# ── 摄像头参数 (input.type=camera 时生效) ───────────────────────
#   实际硬件: USB Camera (uvcvideo), /dev/video0, S/N: 200901010001
#   支持格式:
#     MJPG: 1280x720@60, 800x600@60, 640x480@60, 352x288@60, 320x240@60, 176x144@60
#     YUYV: 1280x720@10, 800x600@15, 640x480@30, 352x288@30, 320x240@30, 176x144@30
camera:
  device: 0               # /dev/videoX
  backend: "V4L2"         # "V4L2" | "ANY"
  width: 640
  height: 480
  fps: 60                 # MJPG 下可达 60fps (1280x720 也可)
  fourcc: "MJPG"          # MJPG (低CPU/高帧率) | YUYV (未压缩/低帧率)
  buffer_size: 1          # V4L2缓冲数 (1=最低延迟)
  auto_exposure: false    # true=自动曝光 | false=手动曝光
  exposure: 156           # 手动曝光值 (仅 auto_exposure=false 时生效, 范围 1-10000)
  auto_white_balance: false  # true=自动白平衡 | false=手动白平衡
  white_balance: 4600     # 白平衡色温/Kelvin (仅 auto_white_balance=false 时生效, 范围 2800-6500)

# ── 视频参数 (input.type=video 时生效) ──────────────────────────
video:
  path: "../data/videos/demo.avi"
  loop: false             # 播放结束后是否循环

# ── YOLO 检测配置 ──────────────────────────────────────────────
yolo:
  model_dir: "../model"    # 模型根目录 (相对 build/ → 项目根)
  model_type: "fp16"      # "fp16" (高精度) | "int8" (高速度)
  input_width: 320
  input_height: 320
  num_classes: 2
  num_threads: 4
  conf_threshold: 0.25
  nms_threshold: 0.45

# ── 检测控制 ───────────────────────────────────────────────────
detect:
  skip_frames: 0               # 0=每帧检测, 1=隔帧, 2=每3帧...
  confidence_threshold: 0.45   # DetectionFilter 最低置信度 (低于此值直接丢弃)
  max_targets: 10              # Top-K 最多保留目标数
  class_filter: [0, 1, 2]      # 类别白名单: 0=Material 1=ColorRing 2=Obstacle

# ── ROI 区域裁剪 ───────────────────────────────────────────────
roi:
  enabled: false          # 是否启用ROI裁剪
  x: 0
  y: 0
  width: 640
  height: 480

# ── HSV 颜色识别 ───────────────────────────────────────────────
color:
  threshold: 0.15         # 颜色判定像素占比阈值
  conf_threshold: 0.15    # 颜色置信度最低阈值
  morph_kernel: 3         # 形态学核大小
  blur_kernel: 3          # 高斯模糊核大小

  # 红色 — 两个范围 (hue在0°/180°处环绕)
  red1:  { h_low: 0,   s_low: 100, v_low: 100, h_high: 10,  s_high: 255, v_high: 255 }
  red2:  { h_low: 170, s_low: 100, v_low: 100, h_high: 180, s_high: 255, v_high: 255 }

  # 蓝色
  blue:  { h_low: 100, s_low: 100, v_low: 50,  h_high: 130, s_high: 255, v_high: 255 }

  # 黄色
  yellow: { h_low: 20,  s_low: 100, v_low: 100, h_high: 35,  s_high: 255, v_high: 255 }

# ── 串口配置 ──────────────────────────────────────────────────
serial:
  device: "/dev/ttyAMA0"
  baudrate: 115200
  data_bits: 8
  stop_bits: 1
  parity: "N"

# ── 显示参数 (vision_demo 使用) ────────────────────────────────
display:
  enable: true
  window_name: "YOLO26n Vision"

# ── 输出参数 (vision_demo 使用) ────────────────────────────────
output:
  save_video: false       # 是否保存结果视频
  path: "./result.mp4"

# ── Benchmark (vision_demo 使用) ───────────────────────────────
benchmark:
  enable: true            # 是否在结束时输出性能统计

# ── 日志配置 ──────────────────────────────────────────────────
log:
  level: "info"           # "debug" | "info" | "warn" | "error"
  use_color: true         # 是否使用终端ANSI颜色
