# ============================================================================
# RaspberryPi5 视觉系统  —  主配置文件
# ============================================================================
#
# 【重要原则】
#   - 应用程序使用的**所有**参数必须在此文件中定义。
#   - 缺少任何键都会导致程序立即退出并打印错误信息。
#   - 代码中**完全没有**硬编码默认值 —— 一切以此文件为准。
#   - 修改参数后无需重新编译，重启程序即可生效。
#
# ============================================================================


# ============================================================================
# 摄像头配置
# ============================================================================
# 支持 USB UVC 摄像头（V4L2 后端）或本地视频文件两种输入源。
# 当 video_path 非空时，优先使用视频文件；否则使用 camera.index 指定的设备。
# ============================================================================
camera:
  index: 0                         # 摄像头设备索引（/dev/video0 = 0, /dev/video1 = 1, …）
                                   # 仅当 video_path 为空时生效

  video_path: ""
                   	           # 视频文件路径，用于离线测试
                                   # 示例："/home/shu/Videos/test.mp4"
                                   # 留空 "" 表示使用真实摄像头

  width: 640                       # 捕获分辨率宽度（像素）
                                   # 必须与摄像头支持的 MJPG 分辨率匹配

  height: 480                      # 捕获分辨率高度（像素）

  fps: 60                          # 目标帧率
                                   # 实际帧率受摄像头能力和光照条件影响


# ============================================================================
# 用户界面配置（OpenCV highgui 窗口）
# ============================================================================
# 控制是否显示 OpenCV 窗口以及叠加的调试信息。
# 在无显示器（headless）部署时可关闭以节省 CPU 资源。
# ============================================================================
ui:
  imshow_enable: true              # 是否显示 OpenCV 窗口
                                   # true  = 显示窗口（调试/演示用）
                                   # false = 不显示窗口（纯后台运行）

  ui_draw_enable: true             # 是否在画面上绘制叠加层
                                   # 叠加内容：FPS、延迟、当前模式、目标位置、ROI 框
                                   # true  = 绘制叠加信息
                                   # false = 仅显示原始画面

  window_name: "RPi5 视觉系统"    # OpenCV 窗口标题

  show_binary: true               # 是否显示二值化调试窗口
                                   # true  = 额外显示各模式的二值化中间结果
                                   #         模式0：各颜色掩码合成图
                                   #         模式1：高斯模糊后的梯度图
                                   #         模式2：黑色掩码
                                   # false = 仅显示主画面


# ============================================================================
# 串口配置
# ============================================================================
# 与远端主控通过 UART 通信。使用自定义二进制帧协议。
# 协议详情见 README.md 或 核心记忆.md 中的串口协议章节。
# ============================================================================
serial:
  port: "/dev/ttyACM0"            # 串口设备路径
                                   # Raspberry Pi 5 上通常是 /dev/ttyUSB0

  baudrate: 115200                 # 波特率
                                   # 支持：9600, 19200, 38400, 57600, 115200, 230400, 460800, 921600
                                   # 收发双方必须一致

  send_interval_ms: 100             # 串口发送最小间隔（毫秒）
                                   # 视觉算法始终 60fps 全速运行，仅串口推送降频
                                   # 模式切换时无视此间隔，立即发送
                                   # 无有效目标时不更新计时器（目标出现立即发送）


# ============================================================================
# Kalman 滤波器配置（所有视觉模式共用）
# ============================================================================
#
# 【数学模型】
#   状态向量： [x, y]  — 仅位置，无速度分量
#   转移矩阵： I₂（2×2 单位矩阵）
#   测量矩阵： I₂（2×2 单位矩阵）
#
# 【噪声参数转换】
#   YAML 中的标量值在代码中会被转换为协方差矩阵：
#     processNoiseCov      = eye(2,2) × process_noise_cov
#     measurementNoiseCov  = eye(2,2) × measurement_noise_cov
#   这意味着 x 和 y 方向使用相同的噪声水平（各向同性假设）。
#
# 【生命周期】
#   初始化 → 稳定跟踪 → 短暂丢失（预测）→ 超时复位
#   模式切换时所有跟踪器立即清空重建。
# ============================================================================
kalman:
  process_noise_cov: 0.01         # 过程噪声协方差（标量）
                                   # 越大 → 滤波器更信任测量值，响应更快但更抖动
                                   # 越小 → 滤波器更平滑，但对快速移动响应滞后
                                   # 典型范围：0.0001 ~ 0.1

  measurement_noise_cov: 0.001      # 测量噪声协方差（标量）
                                   # 越大 → 滤波器更信任预测值，输出更平滑
                                   # 越小 → 滤波器更信任原始检测，跟随更紧密
                                   # 典型范围：0.001 ~ 0.1

  init_frames: 5                   # 初始化所需的连续稳定检测帧数
                                   # 新目标必须连续被检测到此帧数后，才创建 Kalman 跟踪器
                                   # 防止噪点/误检瞬间创建跟踪器

  lost_frame_limit: 25             # 连续丢失帧数阈值
                                   # 目标连续丢失超过此帧数后，跟踪器被标记为未初始化
                                   # 超时复位时执行 statePost = statePre（防止漂移）
                                   # 对于 60 FPS 输入，30 帧 ≈ 0.5 秒

  stable_distance_threshold: 100.0  # "稳定"检测判定的最大像素距离
                                   # 连续帧之间目标位置变化小于此值 → 认为是同一目标稳定出现
                                   # 单位：像素


# ============================================================================
# 视频录制配置
# ============================================================================
# 录制的是**原始帧**（CameraThread 直出），不含任何 UI 叠加层。
# 文件名自动包含时间戳，格式：vision_YYYYMMDD_HHMMSS.avi
# ============================================================================
recording:
  record_mode: false               # 是否启用视频录制
                                   # true  = 录制，每次启动生成新文件
                                   # false = 不录制

  output_dir: "../record"       # 录制文件输出目录
                                   # 目录不存在时会自动创建

  fourcc: "MJPG"                   # 视频编码格式（FourCC 四字符码）
                                   # "MJPG" = Motion JPEG（树莓派上性能最好）
                                   # "XVID" = MPEG-4
                                   # "H264" = H.264（需额外编译支持）

  fps: 60                        # 录制帧率
                                   # 可与采集帧率不同（会丢帧或补帧）


# ============================================================================
# ROI 感兴趣区域配置
# ============================================================================
# 在视觉算法处理前先裁剪画面，减小计算量并排除无关背景。
# 算法检测到的局部坐标会自动转换回全图坐标后再输出。
# ============================================================================
roi:
  x: 0                             # ROI 左上角 X 坐标（像素，从 0 开始）
  y: 0                             # ROI 左上角 Y 坐标（像素，从 0 开始）
  width: 640                       # ROI 宽度（像素）
  height: 480                      # ROI 高度（像素）
                                   # 注意：ROI 必须在摄像头画面范围内，超出部分会被裁剪


# ============================================================================
# 模式0 — 6 颜色物块检测
# ============================================================================
# 算法流水线：
#   ROI → BGR 转 HSV → 逐颜色 inRange 掩码 →
#   形态学开运算（去噪）→ 查找轮廓 → 按面积选最大 →
#   计算质心 → Kalman 滤波 → 输出
#
# 每种颜色**独立**处理，某颜色检测失败不影响其他颜色。
# 红色因 HSV 色相环绕（0° 和 360° 都是红色），使用**双区间**合并。
# ============================================================================
mode0:
  min_contour_area: 5000            # 最小轮廓面积（像素²）
                                   # 小于此面积的轮廓被当作噪点忽略
                                   # 根据目标远近和分辨率调整

  morph_kernel_size: 3             # 形态学开运算核大小（像素）
                                   # 用于去除掩码中的椒盐噪声
                                   # 奇数，越大去噪越强但可能破坏小目标边缘

  # ---- 颜色启用过滤 -----------------------------------------------------
  # 只处理本列表列出的颜色；未列出的颜色被屏蔽（不检测、不发送）。
  # 合法名：["red", "yellow","blue","green","black", "cyan"] （顺序索引 0-5 全局固定，
  # 屏蔽不重编号，串口 Color 字节不会错位）。临时屏蔽某颜色=从列表移除。
  enabled_colors: ["red", "yellow","blue","green","black", "cyan"] 

  # ---- 各颜色 HSV 阈值 ------------------------------------------------
  # OpenCV HSV 范围：
  #   H: 0–180（表示 0°–360°，实际色相值 = H × 2）
  #   S: 0–255（饱和度，0=灰，255=纯色）
  #   V: 0–255（明度，0=黑，255=最亮）
  #
  # 调参建议：
  #   - 先用摄像头拍一张典型场景照片
  #   - 用 调参工具确定各颜色范围
  #   - 环境光照变化时需要重新标定
  # --------------------------------------------------------------------
  colors:
    # ---- 红色（双区间：低 H 0–10 + 高 H 170–180）-----------------
    red:
      range1: { h_min: 0,   s_min: 80,  v_min: 50,  h_max: 10,  s_max: 255, v_max: 255 }
      range2: { h_min: 170, s_min: 100, v_min: 50, h_max: 180, s_max: 255, v_max: 255 }

    # ---- 黄色 ---------------------------------------------------------
    yellow:
      range1: { h_min: 20, s_min: 80, v_min: 100, h_max: 45, s_max: 255, v_max: 255 }

    # ---- 蓝色 ---------------------------------------------------------
    blue:
      range1: { h_min: 100, s_min: 100, v_min: 50, h_max: 140, s_max: 255, v_max: 255 }

    # ---- 绿色 ---------------------------------------------------------
    green:
      range1: { h_min: 50, s_min: 110, v_min: 50, h_max: 70, s_max: 255, v_max: 255 }

    # ---- 黑色（V 上限很低，低明度区域 = 黑色）-------------------------
    black:
      range1: { h_min: 0, s_min: 0, v_min: 0, h_max: 100, s_max: 255, v_max: 80 }

    # ---- 青色 ---------------------------------------------------------
    cyan:
      range1: { h_min: 80, s_min: 70, v_min: 80, h_max: 98, s_max: 170, v_max: 255 }


# ============================================================================
# 模式1 — 多圆环数字识别（同心环剥除 + Hu矩 argmin，TARGET 指定输出）
# ============================================================================
# 靶标实物 = 「中心衬线数字 + 多层同心细环」印章图案。视野内可同时出现
# 多个圆环，逐个识别数字编号，只输出串口 TARGET 指定的那一个。
#
# 算法流水线：
#   ROI → 灰度化 → 高斯模糊（降噪）→ 自适应阈值二值化 →
#   形态学开运算 → findContours(RETR_EXTERNAL) → 面积过滤 → 按面积从大到小排序 →
#   嵌套去重（包围盒包含 + 圆心距 < 0.5×外环半径 → 同一靶标的同心环只留外环）→
#   取前 max_rings_per_frame 个 → 逐环：
#   moments 圆心 + minEnclosingCircle 半径 → 中心方形数字 ROI →
#   数字区自适应二值化 →
#   开运算剥同心细环（核 = digit_open_ratio × 半径，随半径缩放）→
#   取靠近圆心的最大墨块 → cv::matchShapes 与 3 模板对比（argmin 三选一）→
#   同编号冲突则整帧丢弃 → 按 TARGET 筛选 → Kalman → 输出单包
#
# 【关键特性】
#   - 真机上同心圆环是断开的独立轮廓 → 嵌套去重后「一个物理靶标 = 一个候选」，
#     视野内有几个物理靶标就是几个候选（最多 2 个），不做任何"拥挤丢帧"
#   - 视野内可同时出现多个圆环，各自识别数字编号（单个圆环识别失败只跳过它）
#   - TARGET=0 表示圆环空闲：不检测、不输出；TARGET=1/2/3 指定要输出的圆环
#   - 同一帧出现两个相同数字编号 → 整帧丢弃（测量不可信）
#   - 数字笔画粗、环线细且宽随半径成比例 → 开核取 比例×半径 才能远近一致剥环
#   - Hu 矩天然旋转不变，机械臂旋转下无需任何旋转模板
#   - 该字体绝对匹配分偏高且不稳 → 用 argmin 判编号，不做绝对阈值
#   - 目标类型固定为 2，Color 字节存放 TARGET 编号（1/2/3）
# ============================================================================
mode1:
  gaussian_kernel_size: 5          # 高斯模糊核大小（像素，奇数）
                                   # 自适应阈值前轻度降噪

  adaptive_block_size: 31          # 自适应阈值邻域大小（像素，奇数）
                                   # 越大邻域越大，对光照渐变越不敏感
                                   # 典型值：11 / 15 / 31

  adaptive_c: 5                   # 自适应阈值常数
                                   # 从邻域均值中减去，正值=更暗才变白
                                   # 典型值：2 ~ 10

  min_contour_area: 2000            # 最小圆环轮廓面积（像素²）
                                   # 小于此面积的轮廓直接丢弃（过滤噪点）
                                   # 需要实际测试后自行调节

  max_rings_per_frame: 2           # 每帧最多进行"数字识别"的候选圆环数（性能上限）
                                   # 按面积从大到小排序后取前 N 个做模板匹配；
                                   # 未进入前 N 的圆环不做数字识别。缺键即退出。

  morph_open_kernel_size: 3        # 形态学开运算核大小（像素，奇数）
                                   # 在 findContours 前抹掉细微白点和破碎线条

  digit_roi_scale: 0.5             # 数字 ROI 半宽 / 圆环半径
                                   # 在圆心裁剪方形 ROI，边长 = 2 * scale * 半径
                                   # 实测通解 0.45~0.75 均可；太小裁到数字、太大会框进外环

  digit_open_ratio: 0.05          # 数字区"剥环"开运算核 / 圆环半径
                                   # 靶标=中心数字+多层同心细环，环线宽随半径成比例，
                                   # 开核取 比例×半径 才能在不同距离一致剥环(留数字去环)

  invert_digit: false              # 数字二值化是否反色
                                   # false（默认，白底黑字）：THRESH_BINARY_INV，数字为白前景
                                   # true（黑底白字）：THRESH_BINARY，数字为白前景

  # ---- 数字模板路径（键为数字编号 1/2/3）-------------------------------
  # 程序从 build/ 运行时，相对路径以 build/ 为基准，故指向源码树根目录。
  template_paths:
    1: "../templates/num1.png"
    2: "../templates/num2.png"
    3: "../templates/num3.png"


# ============================================================================
# 模式2 — 黑色圆柱检测
# ============================================================================
# 算法流水线：
#   ROI → BGR 转 HSV → 黑色 inRange 掩码 →
#   形态学闭运算（填充空洞）→ 查找轮廓 →
#   对每个轮廓求 minAreaRect → 长宽比 + 面积双重过滤 →
#   取最大的有效候选 → Kalman 滤波 → 输出
#
# 过滤条件：长宽比 > aspect_ratio_threshold  **且**  面积 > min_area
# ============================================================================
mode2:
  # ---- 黑色 HSV 阈值 ------------------------------------------------
  # 黑色特征：V（明度）很低。H 和 S 范围设为全范围，仅靠 V 筛选。
  h_min: 0
  s_min: 0
  v_min: 0
  h_max: 180
  s_max: 255
  v_max: 45                        # 明度上限 —— 只有 V ≤ 45 才被当作黑色
                                   # 值越小黑色越"纯"，但可能漏检暗灰区域
                                   # 值越大越宽松，但可能误检深色物体

  aspect_ratio_threshold: 1.8      # 最小长宽比（长边 / 短边）
                                   # 圆柱体通常长宽比 > 2
                                   # 设为 1.0 则不限制形状

  min_area: 2000                    # 最小轮廓面积（像素²）
                                   # 小于此面积的候选被忽略

  morph_kernel_size: 5             # 形态学闭运算核大小（像素，奇数）
                                   # 闭运算 = 先膨胀再腐蚀，用于填充掩码中的黑洞


# ============================================================================
# 日志配置
# ============================================================================
# 使用 printf 输出彩色终端日志。
# 颜色方案：INFO=绿色  WARN=黄色  ERROR=红色  DEBUG=蓝色
# DEBUG 级别日志仅在 CMake -DCMAKE_BUILD_TYPE=Debug 时编译。
# ============================================================================
logging:
  level: "DEBUG"                    # 日志级别
                                   # "DEBUG" — 所有日志（含 Kalman 跟踪细节、串口字节）
                                   # "INFO"  — 一般信息（启动、模式切换）
                                   # "WARN"  — 警告（摄像头断连、串口发送失败）
                                   # "ERROR" — 错误（配置缺失、硬件故障）

  log_to_file: false               # 是否将日志写入文件
                                   # true  = 同时输出到终端和文件
                                   # false = 仅输出到终端

  log_file_path: "../record/vision.log"    # 日志文件路径（仅当 log_to_file=true 时有效）
