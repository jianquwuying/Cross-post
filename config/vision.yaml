# ============================================================================
# 26年第十二届工程实践与创新大赛  —  参赛作品
# Raspberry Pi 5 视觉系统  —  主配置文件
# ============================================================================
#
# 【运行平台】
#   树莓派 5 Model B（Cortex-A76 ×4，8GB）/ Ubuntu 24.04 aarch64
#   USB UVC 摄像头（MJPG 640×480@60）；主控串口 115200 8N1
#
# 【重要原则】
#   - 本文件是程序唯一的可调参数来源，代码不为配置键提供默认值。
#   - 启动时校验 camera / ui / serial / kalman / recording / roi /
#     mode0 / mode1 / mode2 / logging 十个顶层配置节。
#     任一被读取的键缺失或类型不符 → LOG_ERROR 并以 EXIT_FAILURE 退出。
#   - 修改参数后无需重新编译，重启程序即可生效。
#   - 部分算法内部常量（如墨块面积占比、嵌套去重容差）固定在代码中，
#     不属于本文件的配置项。
#
# ============================================================================


# ============================================================================
# 摄像头配置
# ============================================================================
# 支持两种输入源：
#   - USB UVC 摄像头（CAP_V4L2 后端，MJPG 编码）
#   - 本地视频文件（离线测试）
# video_path 非空时优先使用视频文件；为空时打开 camera.index 指定的 V4L2 设备。
# ============================================================================
camera:
  index: 0                         # 摄像头设备索引（0 = /dev/video0，1 = /dev/video1，…）
                                   # 仅当 video_path 为空时生效

  video_path: ""                   # 视频文件路径，用于离线测试
                                   # 示例："/path/to/test.mp4"
                                   # 留空 "" 表示使用真实摄像头

  width: 640                       # 捕获分辨率宽度（像素）
                                   # 以 MJPG 格式向摄像头请求；实际值以驱动协商结果为准
                                   # （启动日志会打印实际分辨率）

  height: 480                      # 捕获分辨率高度（像素）
                                   # 与 width 一起构成摄像头请求的 MJPG 分辨率

  fps: 60                          # 目标帧率
                                   # 摄像头模式下通过 CAP_PROP_FPS 请求；
                                   # 视频文件模式下作为回放节拍（读取过快时按此帧率休眠）
                                   # 实际帧率受摄像头能力和光照条件影响


# ============================================================================
# 用户界面配置（OpenCV HighGUI 窗口）
# ============================================================================
# 控制主画面窗口与二值化调试窗口。无显示器（headless）部署时，
# 需同时关闭 imshow_enable 与 show_binary，避免创建任何窗口。
# ============================================================================
ui:
  imshow_enable: true              # 是否显示主画面窗口
                                   # true  = 显示主画面（调试/演示用）
                                   # false = 不创建主画面窗口
                                   # 注意：Binary Debug 窗口由 show_binary 单独控制

  ui_draw_enable: true             # 是否在主画面上绘制叠加层（仅当 imshow_enable=true 时生效）
                                   # 叠加内容：ROI 框、模式1 圆环（黄色 "Ring N"）、
                                   # 检测结果标签、状态栏
                                   # 状态栏：Cam FPS / Process FPS / Latency /
                                   #         Mode / Queue / Serial
                                   # true  = 绘制叠加信息
                                   # false = 仅显示原始画面

  window_name: "RPi5 视觉系统"    # OpenCV 主窗口标题

  show_binary: true                # 是否显示 "Binary Debug" 二值化调试窗口
                                   # 独立于 imshow_enable，即使主窗口关闭也会创建该窗口
                                   # true  = 显示各模式的二值化中间结果：
                                   #         模式0：6 色掩码按各自 BGR 颜色合成到黑底
                                   #                （黑色槽位用灰色显示，便于观察）
                                   #         模式1：各成功识别圆环的数字 ROI 二值图
                                   #                按统一高度
                                   #                水平拼接（8 px 白条分隔）；
                                   #                无有效数字时回退环级二值图
                                   #         模式2：黑色掩码
                                   #         模式3：不更新（窗口保留上一模式最后一帧）
                                   # false = 不创建调试窗口


# ============================================================================
# 串口配置
# ============================================================================
# 与主控通过 UART 通信，使用自定义二进制帧（8N1，无流控）：
#   接收（5 字节）：0xCD 0x01 MODE TARGET 0xDC
#                    TARGET 位保留但被完全忽略（不校验、不参与任何判断）
#   发送（9 字节）：0xCD 0x06 TargetType Color X_H X_L Y_H Y_L 0xDC
#                    TargetType：0=无目标帧 1=颜色物块 2=圆环 3=圆柱
#                    坐标为大端 uint16
# 详细字段定义见 README.md「串口协议」章节。
# ============================================================================
serial:
  port: "/dev/ttyACM0"            # 串口设备路径
                                   # 树莓派 5 通过 USB 连接的主控通常枚举为 /dev/ttyACM0；
                                   # CH340 等 USB 转串口设备可能为 /dev/ttyUSB0；
                                   # 以 `ls /dev/ttyACM* /dev/ttyUSB*` 的实际结果为准

  baudrate: 115200                 # 波特率
                                   # 支持：9600, 19200, 38400, 57600, 115200,
                                   #       230400, 460800, 921600
                                   # 收发双方必须一致；填不支持的值会告警并回退到 115200

  send_interval_ms: 50             # 串口结果批次的最小间隔（毫秒），即最高 20 批次/秒
                                   # 视觉算法始终以采集帧率全速运行，仅串口推送降频；
                                   # 每次到点把当前结果列表整体入队（模式0 为 6 包），
                                   # 串口线程再以 100 µs/包 的间隔逐包发出；
                                   # 有结果且 MODE 变化时立即抢断发送并重置计时器；
                                   # 无结果时不发送，也不更新计时器（开关关闭时常见；
                                   # ROI 裁剪为空、模式1 模板加载失败等异常路径也会出现）

  enable_no_target_frame: true      # 「补齐预测坐标 / 0 值包」开关
                                   # true（默认）= 未检出时也按周期推送：
                                   #   模式0：每周期固定 6 包（每色一包）
                                   #          检出 → type=1 + 真实坐标
                                   #                 （Kalman 初始化前为原始测量值，之后为滤波值）
                                   #          未检出但 Kalman 未超时 → type=1 + 预测坐标
                                   #          已超时/冷启动 → type=0 + X=Y=0（Color=槽位号）
                                   #   模式1：每周期固定 1 包（优先级单包，见 mode1 段）
                                   #          仅在环号 2 > 1 > 3 中选第一个可用者
                                   #   模式2：每周期固定 1 包
                                   #          未检出但 Kalman 未超时 → type=3 + 预测坐标
                                   #          已超时/冷启动 → type=0 + Color=0 + 0,0
                                   #   模式3：每周期固定 1 包 {type=0, color=0, 0, 0}
                                   # false = 只播报真实检出：
                                   #   不补 0 值包、不发预测坐标；模式3 空闲也不推送


# ============================================================================
# Kalman 滤波器配置（所有视觉模式共用）
# ============================================================================
#
# 【数学模型】
#   状态向量： [x, y]  — 仅位置，无速度分量
#   转移矩阵： I₂（2×2 单位矩阵）
#   测量矩阵： I₂（2×2 单位矩阵）
#
# 【噪声参数转换】
#   YAML 中的标量值在代码中会被转换为协方差矩阵：
#     processNoiseCov      = eye(2,2) × process_noise_cov
#     measurementNoiseCov  = eye(2,2) × measurement_noise_cov
#   这意味着 x 和 y 方向使用相同的噪声水平（各向同性假设）。
#
# 【生命周期】
#   连续检出 init_frames 帧 → 创建跟踪器（期间输出原始测量值）；
#   跟踪中 → 每帧 predict，检出时 correct，丢失时只 predict 并累计丢失计数；
#   连续丢失达到 lost_frame_limit 帧 → statePost = statePre、标记未初始化；
#   模式切换 → 下一帧 process() 开头清空全部跟踪器。
# ============================================================================
kalman:
  process_noise_cov: 0.01         # 过程噪声协方差（标量）
                                   # 越大 → 滤波器更信任测量值，响应更快但更抖动
                                   # 越小 → 滤波器更平滑，但对快速移动响应滞后
                                   # 典型范围：0.0001 ~ 0.1

  measurement_noise_cov: 0.001      # 测量噪声协方差（标量）
                                   # 越大 → 滤波器更信任预测值，输出更平滑
                                   # 越小 → 滤波器更信任原始检测，跟随更紧密
                                   # 典型范围：0.001 ~ 0.1

  init_frames: 10                   # 初始化所需的连续检出帧数
                                   # 跟踪器未创建前，每帧检出只累加 stable_count；
                                   # 连续达到此帧数后才创建 Kalman，期间输出原始测量值
                                   # 中途丢失一帧即计数清零，防止噪点/误检创建跟踪器

  lost_frame_limit: 5             # 连续丢失帧数阈值
                                   # 丢失计数达到此值（≥）时：statePost = statePre，
                                   # 跟踪器标记为未初始化并清零计数
                                   # （恒等转移矩阵、无速度分量，预测值不会随时间漂移）
                                   # 按 60 FPS 计，5 帧 ≈ 83 ms

  stable_distance_threshold: 100.0  # 未使用键：当前版本不读取此值
                                   # 跟踪器初始化只按 init_frames 连续检出计数，
                                   # 不做帧间距离判定；此值不影响 Kalman 行为
                                   # 保留该键以维持现有配置结构


# ============================================================================
# 视频录制配置
# ============================================================================
# 录制的是**原始帧**（CameraThread 直出），不含任何 UI 叠加层。
# 文件名自动包含时间戳，格式：vision_YYYYMMDD_HHMMSS.avi
# 输出目录必须已存在；目录不存在或不可写时仅打印 WARN，录制被跳过。
# ============================================================================
recording:
  record_mode: false               # 是否启用视频录制
                                   # true  = 录制，每次启动生成新文件
                                   # false = 不录制

  output_dir: "../record"       # 录制文件输出目录（相对程序工作目录）
                                   # 目录必须已存在（autostart.sh 会创建 record/）
                                   # 直接运行时请先 mkdir -p ../record

  fourcc: "MJPG"                   # 视频编码格式（FourCC 四字符码）
                                   # "MJPG" = Motion JPEG（树莓派上性能最好）
                                   # "XVID" = MPEG-4
                                   # "H264" = H.264（取决于 OpenCV 后端编译支持）
                                   # 输出封装固定为 .avi

  fps: 60                        # 录制文件帧率（时间基）
                                   # 每帧仍逐个写入，不丢帧也不补帧；
                                   # 与采集帧率不一致时，回放速度会相应变快/变慢


# ============================================================================
# ROI 感兴趣区域配置
# ============================================================================
# 在视觉算法处理前先裁剪画面，减小计算量并排除无关背景。
# 算法检测到的局部坐标会自动转换回全图坐标后再输出。
# ROI 会先与帧边界求交；裁剪后为空则该帧无检测结果（模式3 不受影响）。
# ============================================================================
roi:
  x: 0                             # ROI 左上角 X 坐标（像素，从 0 开始）
  y: 0                             # ROI 左上角 Y 坐标（像素，从 0 开始）
  width: 640                       # ROI 宽度（像素）
  height: 480                       # ROI 高度（像素）
                                   # 注意：ROI 应在摄像头画面范围内，超出部分会被裁剪


# ============================================================================
# 模式0 — 6 色物块「逐槽位快照」
# ============================================================================
# 串口 TARGET 位保留但被忽略。开关开启时每帧固定输出 6 包，
# 槽位 = 颜色外部编号 1=红 2=黄 3=蓝 4=绿 5=黑 6=青
# （内部颜色索引 / Kalman key = 槽位号 − 1）：
#   检出              → type=1, Color=槽位, 真实坐标（Kalman 初始化前为原始测量值）
#   未检出且未超时     → type=1, Color=槽位, Kalman 预测坐标
#   已超时/冷启动      → type=0, Color=槽位, X=Y=0（0 值包）
#   后两种由 serial.enable_no_target_frame 控制（关闭时只播报真实检出）
# 算法流水线（每个颜色独立执行一遍）：
#   ROI → BGR 转 HSV → 该颜色 inRange 掩码 →
#   形态学开运算（MORPH_OPEN，RECT 核，去噪）→
#   findContours(RETR_EXTERNAL, CHAIN_APPROX_SIMPLE) →
#   按面积选最大轮廓 → moments 质心 →
#   坐标加上 ROI 偏移 → Kalman 滤波 → 输出该槽位一包
#
# 红色因 HSV 色相环绕（0° 和 360° 都是红色），使用**双区间**，
# 两个 inRange 掩码经 bitwise_or 合并。
# 调试图：6 色掩码按各自 BGR 颜色合成到黑底（黑色槽位用灰色显示）。
# ============================================================================
mode0:
  min_contour_area: 10000            # 最小轮廓面积（像素²）
                                   # 小于此面积的轮廓被当作噪点忽略
                                   # 按 ROI 内的像素面积计算，需按目标远近和分辨率调整

  morph_kernel_size: 3             # 形态学开运算核大小（像素，建议奇数）
                                   # 用于去除掩码中的椒盐噪声
                                   # 越大去噪越强，但可能破坏小目标边缘

  # ---- 各颜色 HSV 阈值 ------------------------------------------------
  # OpenCV HSV 范围：
  #   H: 0–180（表示 0°–360°，实际色相值 = H × 2）
  #   S: 0–255（饱和度，0=灰，255=纯色）
  #   V: 0–255（明度，0=黑，255=最亮）
  #
  # 调参建议：
  #   - 用 tools/hsv_calibrator.py 实时查看掩码并标定各颜色范围
  #   - 环境光照变化时需要重新标定
  # --------------------------------------------------------------------
  colors:
    # ---- 红色（双区间：低 H 0–10 + 高 H 170–180，bitwise_or 合并）----
    red:
      range1: { h_min: 0,   s_min: 80,  v_min: 50,  h_max: 10,  s_max: 255, v_max: 255 }
      range2: { h_min: 170, s_min: 100, v_min: 50, h_max: 180, s_max: 255, v_max: 255 }

    # ---- 黄色 ---------------------------------------------------------
    yellow:
      range1: { h_min: 20, s_min: 80, v_min: 100, h_max: 45, s_max: 255, v_max: 255 }

    # ---- 蓝色 ---------------------------------------------------------
    blue:
      range1: { h_min: 100, s_min: 100, v_min: 50, h_max: 140, s_max: 255, v_max: 255 }

    # ---- 绿色 ---------------------------------------------------------
    green:
      range1: { h_min: 50, s_min: 110, v_min: 50, h_max: 70, s_max: 255, v_max: 255 }

    # ---- 黑色（V 上限很低，低明度区域 = 黑色）-------------------------
    black:
      range1: { h_min: 0, s_min: 0, v_min: 0, h_max: 100, s_max: 255, v_max: 80 }

    # ---- 青色 ---------------------------------------------------------
    cyan:
      range1: { h_min: 80, s_min: 70, v_min: 80, h_max: 98, s_max: 170, v_max: 255 }


# ============================================================================
# 模式1 — 多圆环数字识别（同心环剥除 + 归一化位图多角度 IoU）「优先级单包」
# ============================================================================
# 靶标实物 = 「中心印刷数字 + 多层同心细环」。串口 TARGET 位保留但被忽略。
# 开关开启时每周期**只推送 1 包**；环号选择严格按优先级 2 > 1 > 3：
#   该环号本帧识别到     → type=2, Color=环号, 真实坐标（Kalman 初始化前为原始圆心）
#   未识别但跟踪器未超时  → type=2, Color=环号, Kalman 预测坐标
#   三个环号都不可用      → type=0, Color=2, X=Y=0（0 值包）
#   后两种由 serial.enable_no_target_frame 控制（关闭时只推真实检出）
# 选择只看环号优先级：环2 的预测坐标可以压过环1 的真实检出。
# 三个环号的 Kalman 每帧都推进（命中 → correct，未命中 → 只 predict），
# 保证切换优先级时状态新鲜。
#
# 算法流水线：
#   ROI → 灰度化 → 高斯模糊 →
#   自适应阈值（GAUSSIAN_C, BINARY_INV,
#               block = adaptive_block_size, C = adaptive_c）→
#   形态学开运算（MORPH_OPEN, ELLIPSE, morph_open_kernel_size）→
#   findContours(RETR_EXTERNAL) → 面积过滤（min_contour_area）→
#   形状过滤（enable_shape_filter：圆度 ≥ min_circularity、
#             minAreaRect 长边/短边 ≤ max_aspect_ratio、
#             填充率 ≥ min_fill_ratio）→
#   按面积从大到小排序 →
#   嵌套去重（包围盒包含 +2 px 容差，且圆心距 < 0.5×外环半径）→
#   取前 max_rings_per_frame 个 → 逐环：
#   moments 圆心 + minEnclosingCircle 半径 → 中心方形数字 ROI
#   （半宽 = digit_roi_scale × 半径）→
#   数字自适应二值化（邻域 = ROI 短边 × digit_adaptive_block_ratio，
#                     取奇数且不超过 ROI 短边）→
#   开运算剥同心细环（核 = digit_open_ratio × 半径，下限 3 px）→
#   墨块筛选（面积占 ROI 的 0.5%~60%、质心偏移 ≤ 0.6×half、
#             minAreaRect 长边/短边 ≤ 3.5）→
#   按外接框填充并拉伸成 digit_match_size² 二值位图 →
#   与每个数字的模板实例（±digit_match_angle_range，步长
#   digit_match_angle_step）比 IoU，每个数字取最大值 →
#   argmax 三选一；若（最高 IoU − 次高 IoU）< digit_min_margin → 拒答。
#
# 【关键特性】
#   - 形状过滤先剔除线状/条状/方形干扰（如贯穿画面的桌边线、方形纸片），
#     避免它们占用 max_rings_per_frame 名额、把真靶标挤出前 N
#   - 真机上同心圆环是断开的独立轮廓 → 嵌套去重后「一个物理靶标 = 一个候选」；
#     候选数上限为 max_rings_per_frame（当前 3）
#   - 视野内可同时识别多个圆环；单个圆环识别失败只跳过它，不影响其他环
#   - 同一帧两个环判成同一编号 → 该环号本帧按未检出处理，其余环号照常，
#     不整帧丢弃
#   - 数字笔画粗、环线细且宽度随半径成比例 → 剥环开核取 比例×半径，
#     才能在不同距离下一致剥环
#   - 数字匹配 = 归一化二值位图 IoU + 多角度模板实例（旋转由模板覆盖）；
#     旧的 cv::matchShapes/Hu 矩实机验证不可用，详见 digit_match_* 说明
#   - 目标类型固定为 2，Color 字节存放环号（1/2/3）
# ============================================================================
mode1:
  gaussian_kernel_size: 5          # 高斯模糊核大小（像素，奇数）
                                   # 作用于灰度图，自适应阈值前轻度降噪
                                   # 偶数会自动 +1

  adaptive_block_size: 41          # 环级自适应阈值邻域大小（像素，奇数）
                                   # 越大邻域越大，对光照渐变越不敏感；偶数会自动 +1
                                   # 实测（真实靶标 ±90° 旋转 × 0.5~1.3 缩放 + 离焦模糊）：
                                   #   31 → 97.1%、41 → 100%
                                   #   （41 修掉了小目标 + 大角度下漏检环的 2 例）
                                   # 典型值：21 / 31 / 41

  adaptive_c: 10                    # 自适应阈值常数 C（环级与数字级共用）
                                   # 邻域阈值 T = 高斯加权均值 − C。
                                   # 环级固定 THRESH_BINARY_INV：C 越大前景（白）越细，
                                   # 过大易使细环断续；数字级在 invert_digit=false
                                   # （默认，同样 BINARY_INV）时同理，C 过大会削细笔画、
                                   # 降低模板 IoU；若 invert_digit=true（THRESH_BINARY），
                                   # C 越大前景反而越粗。
                                   # 改用归一化位图 IoU 判号后，本机按实际旋转工况
                                   # 扫描 5/7/10/13，确认 10 为最优
                                   # 调参时可围绕 5 ~ 13 逐点验证

  min_contour_area: 5000            # 最小圆环轮廓面积（像素²）
                                   # 小于此面积的轮廓直接丢弃（过滤噪点）
                                   # 按 ROI 内轮廓面积计算，需按实际靶标大小调整

  max_rings_per_frame: 3           # 每帧最多做数字识别的候选圆环数（性能上限）
                                   # 按面积从大到小排序后取前 N 个做模板匹配；
                                   # 未进入前 N 的圆环不判号。缺键即退出。
                                   # 取 3 与环号 1/2/3 对齐：三个环号的 Kalman 都能在
                                   # 识别到时被校正（实际每帧只推 1 包）；
                                   # 多判一个约增加 1.5~2 ms/帧

  enable_shape_filter: true        # 形状过滤开关（默认 true）
                                   # true  = 按下面的圆度/长宽比/填充率剔除线状、
                                   #         条状、方形干扰
                                   # false = 跳过形状过滤（一键回退，便于现场排查）
                                   # 注：关闭后仍会读取下面三个阈值键，缺键照样退出

  min_circularity: 0.4             # 圆度下限 = 4π×面积/周长²（周长用 arcLength(.,true)）
                                   # 理想圆 1.0；本机真实靶标外环实测 0.885；
                                   # 贯穿画面的桌边线实测 0.018 → 0.4 有 2 倍以上裕量
                                   # 线状/锯齿干扰 < 0.2；建议范围 0.3 ~ 0.6
                                   # 若现场光照变差导致真靶标被误杀，可下调此值

  max_aspect_ratio: 2.5            # 长宽比上限 = minAreaRect 长边 / 短边（非 boundingRect）
                                   # 取 minAreaRect 是为了不被靶标旋转/透视放大长宽比
                                   # 理想圆 1.0；本机真实靶标实测 1.00；横向桌边线 22.86
                                   # 建议范围 2.0 ~ 4.0

  min_fill_ratio: 0.85             # 填充率下限 = 面积 / (π × 外接圆半径²)
                                   # 理想圆 1.0；真实靶标实测 0.98；正方形仅 ≈0.64
                                   # 注：正方形圆度≈0.785、长宽比=1.0 能骗过上面两道，
                                   #     必须靠这一道剔除（背景板/方形纸片类干扰）
                                   # 建议范围 0.80 ~ 0.90

  morph_open_kernel_size: 3        # 环级形态学开运算核大小（像素，奇数）
                                   # MORPH_OPEN + ELLIPSE；在 findContours 前
                                   # 抹掉细微白点和破碎线条；偶数会自动 +1

  digit_roi_scale: 0.5             # 数字 ROI 半宽 / 圆环半径
                                   # 在圆心裁剪方形 ROI，边长 = 2 × scale × 半径
                                   # 太小会裁掉数字，太大会框进外环；
                                   # 实测 0.45 ~ 0.75 均可

  digit_open_ratio: 0.04          # 数字区「剥环」开运算核 / 圆环半径
                                   # 靶标 = 中心数字 + 多层同心细环；环线宽度随半径
                                   # 成比例，开核取 比例×半径 才能在不同距离一致剥环
                                   # （保留粗数字笔画、去掉细环）
                                   # 核下限 3 px 并自动取奇数
                                   # 经验范围 0.035 ~ 0.06，当前取 0.04；
                                   # 再大开始削数字，再小剥环不净

  digit_adaptive_block_ratio: 0.30  # 数字二值化自适应阈值邻域 / 数字 ROI 短边
                                   # 数字 ROI 边长 ≈ 圆环半径。该邻域**必须随半径一起
                                   # 放大**：邻域小于数字笔画宽度时，自适应阈值会把
                                   # 笔画内部判成背景（大块实心前景被「掏空」），有效
                                   # 笔画宽度塌缩到 ≈ 邻域/2，随后被按半径缩放的剥环
                                   # 开运算整个抹掉 —— 表现为大半径（目标近/分辨率高）
                                   # 时数字识别失败或判号错误。
                                   # 代码将邻域取奇数，先抬到至少 15 px，
                                   # 再钳到不超过 ROI 短边。
                                   # 实测数字笔画宽 ≈ 0.135×半径，故邻域需 ≳ 0.27
                                   # 才不掏空；取 0.30 留少量余量。继续放大反而削弱
                                   # 自适应特性、拉低模板匹配区分度（实测 ≥0.33 起
                                   # 判定裕量明显下降）。建议范围 0.28 ~ 0.32

  invert_digit: false              # 数字二值化是否反色
                                   # false（默认，白底黑字）：THRESH_BINARY_INV，
                                   #                         数字为白前景
                                   # true（黑底白字）：THRESH_BINARY，数字为白前景

  # ---- 数字匹配（归一化位图 + 多角度 IoU）-------------------------------
  # 实机验证：cv::matchShapes(Hu 矩) 对「笔画粗细/渲染风格」极敏感 —— 真实
  # 相机的数字与任一模板的 I1 距离都 ≈6，而 2/3 两个模板之间只有 1.2，判号
  # 实际被噪声主导（±30° 旋转就会把 2 判成 3）。当前实现：把数字墨块与模板
  # 都按外接框归一化成 digit_match_size² 的二值位图，模板预先生成
  # ±digit_match_angle_range 内每隔 digit_match_angle_step 度的实例，
  # 逐数字取 IoU 最大者，再用 digit_min_margin 做置信度门槛。
  # 实测压力集 69/70（唯一未命中为 0.5× + 大角度漏检环），判号误判 0；
  # 真机 3 号靶标 126 个样本中 125/126 通过 0.07 门槛。
  digit_match_size: 64             # 归一化位图边长（像素）
                                   # 数字墨块与模板都按外接框拉伸到此尺寸后比 IoU
                                   # 代码下限 8
  digit_match_angle_range: 90      # 模板多角度实例的范围（±度）
                                   # 覆盖目标在画面内的旋转；0 = 只生成 0°
  digit_match_angle_step: 15       # 角度步长（度）
                                   # 每个数字生成 (2×range/step + 1) 个实例；
                                   # 当前为 13 个/数字

  digit_min_margin: 0.07           # 判号置信度门槛 = 最高 IoU − 次高 IoU（不同数字之间）
                                   # 低于此值 → **拒答**：该环按识别失败跳过，不参与推送；
                                   # 宁可「没识别到」也不给错编号。0 = 关闭该门槛。
                                   # 实测（3 号环 126 个样本，含 ±90° 旋转 / 0.5~1.3 缩放 /
                                   # 离焦模糊 / 0.7~1.3 亮度）：正确样本裕量最小 0.083、
                                   # 中位 0.164；唯一一例误判裕量仅 0.056（严重离焦 + 过曝）。
                                   # 取 0.07：误判被剔除，且保留 125/126 个正确判定

  # ---- 数字模板路径（键为数字编号 1/2/3）-------------------------------
  # 模式1 首次进入时懒加载；路径相对于程序工作目录。
  # 程序从 build/ 运行时，相对路径以 build/ 为基准，故指向源码树根目录。
  # 任一模板缺失、无法读取或无法归一化 → 打印 ERROR，模式1 无输出
  # （加载失败后 digit_templates_loaded_ 保持 false，每帧重试并重复打印）。
  template_paths:
    1: "../templates/num1.png"
    2: "../templates/num2.png"
    3: "../templates/num3.png"


# ============================================================================
# 模式2 — 黑色圆柱检测
# ============================================================================
# 算法流水线：
#   ROI → BGR 转 HSV → 黑色 inRange 掩码 →
#   形态学闭运算（MORPH_CLOSE，RECT 核，填充空洞）→
#   findContours(RETR_EXTERNAL) →
#   对每个轮廓求 minAreaRect → 长宽比 + 面积双重过滤 →
#   取面积最大的有效候选 → minAreaRect 中心加 ROI 偏移 → Kalman 滤波 → 输出
#
# 过滤条件：长宽比 ≥ aspect_ratio_threshold 且 面积 ≥ min_area
# （长宽比取 minAreaRect 长边/短边）
# 调试图：黑色掩码。
# ============================================================================
mode2:
  # ---- 黑色 HSV 阈值 ------------------------------------------------
  # 黑色特征：V（明度）很低。H 和 S 范围设为全范围，仅靠 V 筛选。
  h_min: 0
  s_min: 0
  v_min: 0
  h_max: 180
  s_max: 255
  v_max: 45                        # 明度上限 —— 只有 V ≤ 45 才被当作黑色
                                   # 值越小黑色越「纯」，但可能漏检暗灰区域
                                   # 值越大越宽松，但可能误检深色物体

  aspect_ratio_threshold: 1.8      # 最小长宽比（minAreaRect 长边 / 短边）
                                   # 圆柱体通常长宽比 > 2；过滤时要求 ≥ 此值
                                   # 设为 1.0 则不限制形状（长宽比恒 ≥ 1）

  min_area: 2000                    # 最小轮廓面积（像素²）
                                   # 小于此面积的候选被忽略；过滤时要求 ≥ 此值

  morph_kernel_size: 5             # 形态学闭运算核大小（像素，建议奇数）
                                   # MORPH_CLOSE + RECT；先膨胀再腐蚀，填充掩码黑洞


# ============================================================================
# 日志配置
# ============================================================================
# Logger 为单例，双通道输出：
#   - 控制台：std::printf 输出 ANSI 彩色文本，
#             INFO=绿  WARN=黄  ERROR=红  DEBUG=蓝
#   - 文件：  纯文本（无 ANSI 转义码），每条立即 flush
# DEBUG 级别日志仅在编译时定义 DEBUG 宏才存在
# （CMake Debug 构建自动添加 -DDEBUG）。
# ============================================================================
logging:
  level: "DEBUG"                    # 日志级别（保留键，当前版本不据此过滤）
                                   # 实际输出仅由编译类型决定：
                                   #   Debug   构建（-DDEBUG）：
                                   #     DEBUG / INFO / WARN / ERROR 全部输出
                                   #   Release 构建：LOG_DEBUG 不编译，
                                   #     仅 INFO / WARN / ERROR
                                   # 可填 "DEBUG" / "INFO" / "WARN" / "ERROR"，
                                   # 当前均不改变输出

  log_to_file: false               # 是否同时写入日志文件
                                   # true  = 控制台 + 文件（追加模式）
                                   # false = 仅控制台

  log_file_path: "../record/vision.log"    # 日志文件路径（仅当 log_to_file=true 时有效）
                                   # 相对程序工作目录；目录必须已存在，
                                   # 否则打印 ERROR 并退化为仅控制台输出
